server.port=8086
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/news_meter}
spring.datasource.username=${DB_USER:news_meter}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__analyses.sql
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
news.ai-url=${AI_URL:http://127.0.0.1:8001}
news.rubric.version=1.0
news.rubric.thresholds=15,35,65
news.rubric.weights=loaded_language:7,one_sided_framing:10,clickbait:8,headline_mismatch:14,exaggeration:11,material_omission:15
news.rubric.contradiction=32
news.rubric.missing-context=12
